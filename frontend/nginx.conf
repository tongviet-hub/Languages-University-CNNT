server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;   # mọi route của React -> index.html
    }
    location /assets/ {
        expires 1y;                          # file có mã băm trong tên -> cache lâu
        add_header Cache-Control "public, immutable";
    }
}
