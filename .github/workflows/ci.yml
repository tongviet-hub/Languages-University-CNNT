name: CI

# Kiểm tra chất lượng code trước khi được merge / deploy. Logic thật nằm trong ci/*.sh
# (chạy được y hệt ở máy cá nhân: bash ci/start-ci.sh), file này chỉ khai báo khi nào chạy cái gì.
#
#   changes       -> xác định thành phần nào bị sửa (chỉ test lại phần đó)
#   build-test    -> lint, typecheck, test, build từng thành phần               [CHẶN]
#   docker-build  -> build thử Docker image + Trivy quét lỗ hổng CRITICAL       [CHẶN]
#   security      -> Gitleaks (secret) + npm audit + Trivy fs (thư viện, Dockerfile) [KHÔNG CHẶN]
#   ci-ok         -> 1 check tổng để đặt "Required" trong branch protection
#
# Push lên main mà CI xanh -> workflow "CD" (cd.yml) tự chạy tiếp.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Push commit mới vào cùng PR/nhánh thì huỷ lần chạy cũ, đỡ tốn phút chạy
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quyền tối thiểu; job nào cần thêm thì tự khai báo
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  changes:
    name: Phát hiện thay đổi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter đọc danh sách file của PR
    outputs:
      components: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7

      # Sửa ci/ hoặc workflow thì coi như mọi thành phần đều đổi -> chạy lại tất cả.
      # Chạy tay (workflow_dispatch) cũng chạy tất cả.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'ci/**'
              - '.github/workflows/ci.yml'
            frontend:
              - *shared
              - 'frontend/**'
            portal:
              - *shared
              - 'backend/portal/**'
            academic-api:
              - *shared
              - 'backend/academic-api/**'
            finance-api:
              - *shared
              - 'backend/finance-api/**'

      - name: Danh sách cần kiểm tra
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: 'echo "Thành phần thay đổi: $CHANGES"'

  build-test:
    name: Build & test (${{ matrix.component }})
    needs: changes
    if: needs.changes.outputs.components != '[]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # 1 thành phần hỏng vẫn chạy tiếp các thành phần khác để thấy hết lỗi
      matrix:
        component: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["frontend","portal","academic-api","finance-api"]') || fromJSON(needs.changes.outputs.components) }}
        exclude:
          - component: shared
    # PostgreSQL thật cho test e2e của academic-api (giống hệt bản chạy production: postgres:17-alpine).
    # Thành phần khác không dùng tới, chỉ tốn vài giây khởi động.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: school_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school -d school_portal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: school
      DB_PASSWORD: ci_only_password # chỉ dùng cho DB tạm của CI, không phải secret thật
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/*/package-lock.json

      - name: Lint, typecheck, test, build
        run: bash ci/build-test.sh "${{ matrix.component }}"

      - name: Lưu bản build frontend
        if: matrix.component == 'frontend'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 7

  docker-build:
    name: Docker build & scan (${{ matrix.component }})
    needs: [changes, build-test]
    if: needs.changes.outputs.components != '[]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["frontend","portal","academic-api","finance-api"]') || fromJSON(needs.changes.outputs.components) }}
        exclude:
          - component: shared
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build y như CD (cùng Dockerfile, cùng cache) nhưng KHÔNG push: chỉ để chắc chắn image build được
      # và không mang lỗ hổng CRITICAL. CD sau đó dùng lại cache này nên build rất nhanh.
      - name: Build image (không push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component == 'frontend' && 'frontend' || format('backend/{0}', matrix.component) }}
          load: true
          tags: portal-${{ matrix.component }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=portal-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=portal-${{ matrix.component }}

      - name: Trivy quét image (chặn khi có CRITICAL)
        run: bash ci/scan-image.sh "portal-${{ matrix.component }}:ci-${{ github.sha }}"

  security:
    name: Quét bảo mật
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # đẩy kết quả SARIF lên tab Security
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Gitleaks cần toàn bộ lịch sử git

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Secret scan (Gitleaks)
        continue-on-error: true
        run: bash ci/scan-secrets.sh

      - name: Dependency & misconfig scan (npm audit + Trivy)
        continue-on-error: true
        run: bash ci/scan-deps.sh

      # Code scanning cần repo public hoặc có GitHub Advanced Security; không có thì bỏ qua, không làm đỏ CI.
      - name: Đẩy kết quả lên tab Security
        if: always() && hashFiles('ci-reports/*.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ci-reports

      - name: Lưu báo cáo quét
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-${{ github.sha }}
          path: ci-reports
          if-no-files-found: ignore
          retention-days: 14

  ci-ok:
    name: CI OK
    # Luôn chạy (kể cả khi job trước bị skip vì không có thay đổi) để branch protection luôn có kết quả
    if: always()
    needs: [changes, build-test, docker-build, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tổng hợp kết quả
        run: |
          echo "changes=${{ needs.changes.result }} build-test=${{ needs.build-test.result }} docker-build=${{ needs.docker-build.result }} security=${{ needs.security.result }}"
          # skipped = không có gì để kiểm tra -> vẫn tính là đạt
          for r in "${{ needs.changes.result }}" "${{ needs.build-test.result }}" "${{ needs.docker-build.result }}" "${{ needs.security.result }}"; do
            if [[ "$r" == failure || "$r" == cancelled ]]; then
              echo "::error::CI chưa đạt"; exit 1
            fi
          done
          echo "CI đạt"
